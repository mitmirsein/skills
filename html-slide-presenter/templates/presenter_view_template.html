<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎙️ 모바일 발표자 리모컨 (Presenter View) · {{TITLE}}</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141416;
      --card-bg: #202024;
      --border: #323238;
      --text-main: #EDEDF0;
      --text-muted: #9E9EA8;
      --accent: #E07A48;
      --green: #4EBA7C;
      --blue: #4D96FF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: "Pretendard", system-ui, -apple-system, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: text;
      -webkit-user-select: text;
      touch-action: manipulation;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #1A1A1E;
      border-bottom: 1.5px solid var(--border);
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .slide-badge {
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      background: #2A2A30;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid #3A3A42;
    }
    .timer-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: monospace;
      font-size: 18px;
      font-weight: 700;
      color: #FFF;
      background: #000;
      padding: 3px 10px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .clock-display {
      font-size: 13px;
      color: var(--text-muted);
      font-family: monospace;
      display: none;
    }
    @media (min-width: 640px) {
      .clock-display { display: inline-block; }
    }

    .main-grid {
      display: flex;
      flex-direction: row;
      gap: 16px;
      padding: 14px 16px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .notes-panel {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1.6;
      min-height: 0;
      overflow: hidden;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      gap: 12px;
      overflow: hidden;
    }

    /* Mobile Single Column Layout */
    @media (max-width: 768px) {
      .main-grid {
        flex-direction: column;
        padding: 8px 10px;
        gap: 8px;
      }
      .notes-panel {
        flex: 1;
        min-height: 0;
        padding: 12px 14px;
      }
      .side-panel {
        display: none !important;
      }
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .font-btns {
      display: flex;
      gap: 4px;
    }
    .small-btn {
      background: #2C2C32;
      border: 1px solid var(--border);
      color: #FFF;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }
    .small-btn:active { background: #444; }

    .current-title-bar-mobile {
      display: none;
      padding: 8px 12px;
      background: #18181C;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 800;
      color: #FFF;
      border-left: 4px solid var(--accent);
      flex-shrink: 0;
      line-height: 1.4;
    }
    @media (max-width: 768px) {
      .current-title-bar-mobile { display: block; }
    }

    .speech-box {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      font-family: "Pretendard", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      font-size: 19px;
      line-height: 1.75;
      color: #FFFFFF;
      background: transparent;
      padding: 6px 4px 20px 4px;
      word-break: keep-all;
      -webkit-overflow-scrolling: touch;
    }
    .speech-box::-webkit-scrollbar { width: 5px; }
    .speech-box::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

    /* 문단형식: 내어쓰기 (Hanging Indent) */
    .speech-line {
      margin-bottom: 8px;
      padding-left: 1.35em;
      text-indent: -1.35em;
    }
    .speech-line.sub-1 {
      padding-left: 2.6em;
      text-indent: -1.35em;
      color: #D6D6DF;
    }
    .speech-line.sub-2 {
      padding-left: 3.85em;
      text-indent: -1.35em;
      color: #B5B5C0;
    }
    .speech-line-gap {
      height: 8px;
    }

    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .current-title-card {
      border-left: 4px solid var(--accent);
    }
    .current-slide-heading {
      font-size: 16px;
      font-weight: 800;
      color: #FFF;
      margin-top: 4px;
      line-height: 1.4;
    }
    .next-slide-card {
      border-left: 4px solid var(--green);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .next-thumbnail-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0B0B0E;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
      margin: 6px 0 10px 0;
      flex-shrink: 0;
    }
    .next-thumbnail-scaler {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .next-thumbnail-frame {
      width: 1920px;
      height: 1080px;
      border: none;
      transform-origin: top left;
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      background: #18181C;
    }
    .next-thumbnail-end-msg {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      background: #111114;
      text-align: center;
      padding: 12px;
    }
    .next-slide-heading {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--green);
      margin-top: 2px;
      line-height: 1.35;
    }
    .next-speech-snippet {
      margin-top: 6px;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text-muted);
      overflow-y: auto;
      font-family: "Pretendard", system-ui, sans-serif;
    }

    footer {
      background: #1A1A1E;
      border-top: 1.5px solid var(--border);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .nav-btn {
      background: #2D2D34;
      border: 1.5px solid var(--border);
      color: #FFF;
      font-size: 15px;
      font-weight: 800;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 1;
      min-height: 48px;
      touch-action: manipulation;
    }
    .nav-btn:active {
      transform: scale(0.97);
    }
    .nav-btn-next {
      background: var(--accent);
      border-color: var(--accent);
      flex: 1.4;
    }
    .jump-group {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      max-width: 45%;
      padding: 2px 0;
    }
    @media (max-width: 640px) {
      .jump-group { display: none; }
    }
    .jump-btn {
      background: #25252B;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      min-width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
    }
    .jump-btn.active {
      background: var(--accent);
      color: #FFF;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <span class="slide-badge" id="pSlideBadge">Slide 1 / {{TOTAL_SLIDES}}</span>
      <span class="status-badge" id="pSyncStatus">🟢 맥북 연결됨</span>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span class="clock-display" id="pClock">00:00:00</span>
      <div class="timer-container">
        <span id="pTimer">00:00</span>
        <button class="small-btn" id="pTimerBtn" title="타이머 일시정지/재생" style="padding:2px 6px;">⏸️</button>
        <button class="small-btn" id="pTimerReset" title="타이머 초기화" style="padding:2px 6px;">🔄</button>
      </div>
    </div>
  </header>

  <div class="main-grid" id="mainTouchArea">
    <!-- Speaker Notes Panel -->
    <div class="notes-panel">
      <div class="panel-header">
        <span class="panel-title">🗒️ 발표 대본 (Speaker Notes)</span>
        <div class="font-btns">
          <button class="small-btn" id="pFontDown">가-</button>
          <button class="small-btn" id="pFontUp">가+</button>
        </div>
      </div>
      
      <!-- Mobile Current Slide Heading -->
      <div class="current-title-bar-mobile" id="pCurrentTitleMobile">-</div>

      <div class="speech-box" id="pSpeechBox">대본을 불러오는 중...</div>
    </div>

    <!-- Side Panel (Tablet/Desktop Info) -->
    <div class="side-panel">
      <div class="card current-title-card">
        <span style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">현재 화면</span>
        <div class="current-slide-heading" id="pCurrentTitle">-</div>
      </div>

      <div class="card next-slide-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <span style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">다음 슬라이드 미리보기</span>
          <span id="pNextBadge" style="font-size:11px; font-family:monospace; color:var(--green); font-weight:700;">-</span>
        </div>

        <!-- 16:9 Live Slide Thumbnail Canvas -->
        <div class="next-thumbnail-container" id="pNextThumbContainer">
          <div class="next-thumbnail-scaler">
            <iframe id="pNextFrame" src="{{MAIN_SLIDES_FILENAME}}?preview=1" class="next-thumbnail-frame" scrolling="no" tabindex="-1"></iframe>
          </div>
          <div class="next-thumbnail-end-msg" id="pNextEndMsg">🎉 마지막 슬라이드입니다 (End of Deck)</div>
        </div>

        <div class="next-slide-heading" id="pNextTitle">-</div>
        <div class="next-speech-snippet" id="pNextSnippet">-</div>
      </div>
    </div>
  </div>

  <footer>
    <button class="nav-btn" id="pPrevBtn">◀ 이전</button>
    <div class="jump-group" id="pJumpGroup"></div>
    <button class="nav-btn nav-btn-next" id="pNextBtn">다음 슬라이드 ▶</button>
  </footer>

  <script>
    const speeches = {{SPEECHES_JSON}};
    const slideTitles = {{TITLES_JSON}};
    const SYNC_CHANNEL_NAME = '{{CHANNEL_NAME}}';

    const sync = new BroadcastChannel(SYNC_CHANNEL_NAME);
    let pCurrentSlide = 1;
    let pTotalSlides = slideTitles.length;
    let fontSize = window.innerWidth <= 768 ? 18 : 22;

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatSpeechHTML(text) {
      if (!text) return '';
      return text.split('\n').map(line => {
        const trimmed = line.trim();
        if (!trimmed) return '<div class="speech-line-gap"></div>';
        
        let level = 0;
        if (line.startsWith('    ') || line.startsWith('\t\t')) level = 2;
        else if (line.startsWith('  ') || line.startsWith('\t')) level = 1;
        
        const className = level === 2 ? 'speech-line sub-2' : (level === 1 ? 'speech-line sub-1' : 'speech-line');
        return `<div class="${className}">${escapeHtml(trimmed)}</div>`;
      }).join('');
    }

    function updateNextThumbnailScale() {
      const container = document.getElementById('pNextThumbContainer');
      const frame = document.getElementById('pNextFrame');
      if (!container || !frame) return;
      
      const containerWidth = container.clientWidth;
      if (containerWidth > 0) {
        const scale = containerWidth / 1920;
        frame.style.transform = `scale(${scale})`;
      }
    }

    window.addEventListener('resize', updateNextThumbnailScale);

    function renderPresenterUI(index) {
      if (index < 1) index = 1;
      if (index > pTotalSlides) index = pTotalSlides;
      pCurrentSlide = index;

      document.getElementById('pSlideBadge').textContent = `Slide ${pCurrentSlide} / ${pTotalSlides}`;
      const curTitle = slideTitles[pCurrentSlide - 1] || '';
      document.getElementById('pCurrentTitle').textContent = curTitle;
      document.getElementById('pCurrentTitleMobile').textContent = curTitle;
      
      document.getElementById('pNextTitle').textContent = slideTitles[pCurrentSlide] || '(마지막 슬라이드입니다)';
      document.getElementById('pSpeechBox').innerHTML = formatSpeechHTML(speeches[pCurrentSlide - 1] || '');
      
      document.getElementById('pSpeechBox').scrollTop = 0;

      const nextSp = speeches[pCurrentSlide] || '';
      document.getElementById('pNextSnippet').textContent = nextSp ? (nextSp.slice(0, 180) + (nextSp.length > 180 ? '...' : '')) : '-';

      // ─── Next Slide Thumbnail Sync ───
      const nextSlide = index < pTotalSlides ? index + 1 : null;
      const nextFrame = document.getElementById('pNextFrame');
      const nextEndMsg = document.getElementById('pNextEndMsg');
      const nextBadge = document.getElementById('pNextBadge');

      if (nextSlide) {
        if (nextBadge) nextBadge.textContent = `Slide ${nextSlide} / ${pTotalSlides}`;
        if (nextFrame) {
          nextFrame.style.display = 'block';
          syncNextThumbnail(nextSlide);
        }
        if (nextEndMsg) nextEndMsg.style.display = 'none';
      } else {
        if (nextBadge) nextBadge.textContent = 'END';
        if (nextFrame) nextFrame.style.display = 'none';
        if (nextEndMsg) nextEndMsg.style.display = 'flex';
      }
      setTimeout(updateNextThumbnailScale, 50);

      document.querySelectorAll('.jump-btn').forEach((b, idx) => {
        if (idx + 1 === pCurrentSlide) b.classList.add('active');
        else b.classList.remove('active');
      });
    }

    function syncNextThumbnail(slideNum) {
      const frame = document.getElementById('pNextFrame');
      if (!frame || !slideNum) return;
      try {
        if (frame.contentWindow && typeof frame.contentWindow.showSlide === 'function') {
          frame.contentWindow.showSlide(slideNum, false);
        } else {
          frame.contentWindow?.postMessage({ type: 'SHOW_SLIDE', index: slideNum }, '*');
        }
      } catch(e) {
        frame.contentWindow?.postMessage({ type: 'SHOW_SLIDE', index: slideNum }, '*');
      }
    }

    const nextFrameEl = document.getElementById('pNextFrame');
    if (nextFrameEl) {
      nextFrameEl.addEventListener('load', () => {
        const nextSlide = pCurrentSlide < pTotalSlides ? pCurrentSlide + 1 : null;
        if (nextSlide) syncNextThumbnail(nextSlide);
        updateNextThumbnailScale();
      });
    }

    // ──────────────────────────────────────────────────────────────────
    // Network Remote Sync (Ultra-Fast 100ms Fast-Polling + POST)
    // ──────────────────────────────────────────────────────────────────
    const statusBadge = document.getElementById('pSyncStatus');
    let pSyncVersion = 0;

    if (location.protocol.startsWith('http')) {
      setInterval(async () => {
        try {
          const res = await fetch(`/api/state?_t=${Date.now()}`);
          if (res.ok) {
            const data = await res.json();
            statusBadge.textContent = '🟢 맥북 무선 연동됨';
            statusBadge.style.color = '#4EBA7C';

            if (data.version > pSyncVersion) {
              pSyncVersion = data.version;
              if (typeof data.slide === 'number' && data.slide !== pCurrentSlide) {
                renderPresenterUI(data.slide);
              }
            }
          } else {
            statusBadge.textContent = '🟡 연결 대기 중';
            statusBadge.style.color = '#E07A48';
          }
        } catch (err) {
          statusBadge.textContent = '🔴 재연결 시도 중...';
          statusBadge.style.color = '#FF6B6B';
        }
      }, 100);
    } else {
      statusBadge.textContent = '⚪ 로컬 단독 모드';
    }

    function sendSlideToServer(target) {
      if (!location.protocol.startsWith('http')) return;
      fetch('/api/slide', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slide: target })
      }).then(r => r.json()).then(d => {
        if (d && d.version) pSyncVersion = d.version;
      }).catch(() => {});
    }

    // Real-time Clock
    setInterval(() => {
      const now = new Date();
      document.getElementById('pClock').textContent = now.toLocaleTimeString('ko-KR', { hour12: false });
    }, 1000);
    const now = new Date();
    document.getElementById('pClock').textContent = now.toLocaleTimeString('ko-KR', { hour12: false });

    // Presentation Timer
    let timerSec = 0;
    let timerRunning = true;
    const timerEl = document.getElementById('pTimer');
    setInterval(() => {
      if (timerRunning) {
        timerSec++;
        const mins = String(Math.floor(timerSec / 60)).padStart(2, '0');
        const secs = String(timerSec % 60).padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
      }
    }, 1000);

    document.getElementById('pTimerBtn').onclick = () => {
      timerRunning = !timerRunning;
      document.getElementById('pTimerBtn').textContent = timerRunning ? '⏸️' : '▶️';
    };
    document.getElementById('pTimerReset').onclick = () => {
      timerSec = 0;
      timerEl.textContent = '00:00';
    };

    // Font Sizing
    document.getElementById('pFontUp').onclick = () => {
      if (fontSize < 36) fontSize += 2;
      document.getElementById('pSpeechBox').style.fontSize = fontSize + 'px';
    };
    document.getElementById('pFontDown').onclick = () => {
      if (fontSize > 13) fontSize -= 2;
      document.getElementById('pSpeechBox').style.fontSize = fontSize + 'px';
    };

    // Navigation & Haptics
    function triggerHaptic() {
      if ('vibrate' in navigator) {
        try { navigator.vibrate(15); } catch(e){}
      }
    }

    function goToSlide(target) {
      if (target < 1) target = 1;
      if (target > pTotalSlides) target = pTotalSlides;
      renderPresenterUI(target);
      triggerHaptic();

      sync.postMessage({ type: 'GOTO_SLIDE', slide: target });
      sendSlideToServer(target);

      try {
        localStorage.setItem(SYNC_CHANNEL_NAME + '_current', target);
      } catch(e){}
    }

    document.getElementById('pNextBtn').onclick = () => goToSlide(pCurrentSlide + 1);
    document.getElementById('pPrevBtn').onclick = () => goToSlide(pCurrentSlide - 1);

    // Build Jump Buttons
    const jumpGroup = document.getElementById('pJumpGroup');
    jumpGroup.innerHTML = '';
    for (let i = 1; i <= pTotalSlides; i++) {
      const btn = document.createElement('button');
      btn.className = 'jump-btn' + (i === 1 ? ' active' : '');
      btn.id = 'pJump' + i;
      btn.textContent = i;
      btn.onclick = () => goToSlide(i);
      jumpGroup.appendChild(btn);
    }

    // Touch Swipe Gestures for Mobile
    let touchStartX = 0;
    let touchStartY = 0;
    const touchArea = document.getElementById('mainTouchArea');

    touchArea.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    touchArea.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
        if (diffX < 0) {
          goToSlide(pCurrentSlide + 1);
        } else {
          goToSlide(pCurrentSlide - 1);
        }
      }
    }, { passive: true });

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'Enter') {
        e.preventDefault();
        goToSlide(pCurrentSlide + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') {
        e.preventDefault();
        goToSlide(pCurrentSlide - 1);
      } else if (e.key >= '1' && e.key <= '9') {
        goToSlide(parseInt(e.key));
      }
    });

    // Local BroadcastChannel Listener
    sync.onmessage = (e) => {
      if (e.data && e.data.type === 'SLIDE_CHANGE') {
        renderPresenterUI(e.data.currentSlide);
      }
    };

    window.addEventListener('storage', (e) => {
      if (e.key === SYNC_CHANNEL_NAME + '_current' && e.newValue) {
        renderPresenterUI(parseInt(e.newValue));
      }
    });

    // Initial render
    const saved = localStorage.getItem(SYNC_CHANNEL_NAME + '_current');
    renderPresenterUI(saved ? parseInt(saved) : 1);
    sync.postMessage({ type: 'REQUEST_STATE' });
  </script>
